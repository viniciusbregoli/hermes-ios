name: Hermes
options:
  bundleIdPrefix: com.viniciusbregoli
  deploymentTarget:
    iOS: "17.0"
packages:
  HermesKit:
    path: .
targets:
  Hermes:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HermesKit
        product: HermesUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viniciusbregoli.hermes-mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Set to your Apple team id (Xcode > Settings > Accounts) before running on a device.
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to send to Hermes."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save images from Hermes to your photo library."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
